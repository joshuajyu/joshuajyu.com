<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Joshua Yu</title>
  <meta name="description" content="A new site is on the way.">
  <meta name="robots" content="noindex">
  <style>
    :root {
      --bg: #fafaf9;
      --fg: #1c1917;
      --muted: #78716c;
      --accent: #d97706;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0c0a09;
        --fg: #f5f5f4;
        --muted: #a8a29e;
        --accent: #f59e0b;
      }
    }
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      display: grid;
      place-items: center;
      padding: 16px;
    }
    main { max-width: 32rem; text-align: center; }
    .dot {
      display: inline-block;
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--accent);
      margin-bottom: 1.5rem;
      animation: pulse 2s ease-in-out infinite;
    }
    h1 { font-size: clamp(2rem, 6vw, 3rem); font-weight: 600; letter-spacing: -0.02em; }
    p { margin-top: 0.75rem; color: var(--muted); font-size: 1.125rem; line-height: 1.6; }
    @keyframes pulse { 50% { opacity: 0.3; transform: scale(0.8); } }
    @media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
  </style>
</head>
<body>
  <main>
    <span class="dot" aria-hidden="true"></span>
    <h1>Joshua Yu</h1>
    <p>A new site is under construction. Check back soon.</p>
  </main>
</body>
</html>
